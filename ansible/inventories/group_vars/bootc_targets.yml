---
# Connection identity for the Terraform-provisioned bootc VMs. Host IPs come
# from the generated inventory (terraform.generated.yml); connection config
# lives here on the Ansible side per ADR 0001 (Ansible owns configuration).
#
# The cloud-init template creates the 'd3' user with the d3_ops SSH key, so
# Ansible connects as that user with the matching private key. The key is never
# stored in git — supply it at run time via `op run` / env referencing
# op://d3HLPRV/d3_ops/private key, exported to a file path.
ansible_user: d3
ansible_become: true
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'BOOTC_SSH_PRIVATE_KEY_FILE') }}"
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
