---
- name: Preflight RHEL bootc qcow2 Proxmox template target
  hosts: "{{ pve_template_node | default('proxmox_template_builders') }}"
  gather_facts: false
  become: true
  vars:
    pve_qcow2_path: "/mnt/pve/cFS/import/rhel10-bootc-20260606.1.qcow2"
    pve_qcow2_sha256: "5efb97c95c9ce3045994551da3b9e5bda94a4100aefdb337922de6066d8d1b7c"
    pve_template_vmid: 9001
    pve_template_name: "rhel10-bootc-20260606-1-tmpl"
    pve_ceph_storage: "cephVM"
  tasks:
    - name: Require explicit Proxmox template target
      ansible.builtin.assert:
        that:
          - pve_template_node is defined
          - pve_template_node | length > 0
        fail_msg: >-
          Set pve_template_node to the Proxmox inventory host that owns template
          builds. Example: -e pve_template_node=nodeF
        quiet: true

    - name: Verify Ceph storage is active on target node
      ansible.builtin.command:
        argv:
          - pvesm
          - status
          - --storage
          - "{{ pve_ceph_storage }}"
      register: pve_ceph_status
      changed_when: false
      failed_when: pve_ceph_status.rc != 0 or 'active' not in pve_ceph_status.stdout

    - name: Verify staged qcow2 artifact checksum
      ansible.builtin.stat:
        path: "{{ pve_qcow2_path }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: pve_qcow2_stat
      failed_when: >-
        not pve_qcow2_stat.stat.exists
        or pve_qcow2_stat.stat.checksum != pve_qcow2_sha256

    - name: Read existing VMID config if present
      ansible.builtin.command:
        argv:
          - qm
          - config
          - "{{ pve_template_vmid }}"
      register: pve_existing_config
      changed_when: false
      failed_when: false

    - name: Fail if VMID belongs to a different VM/template
      ansible.builtin.assert:
        that:
          - pve_existing_config.rc != 0
            or pve_template_name in pve_existing_config.stdout
        fail_msg: >-
          VMID {{ pve_template_vmid }} already exists and does not match
          {{ pve_template_name }}. Choose a different VMID before live
          registration.
        quiet: true

    - name: Show read-only preflight evidence
      ansible.builtin.debug:
        msg:
          - "node: {{ inventory_hostname }}"
          - "storage: {{ pve_ceph_storage }} active"
          - "qcow2: {{ pve_qcow2_path }}"
          - "sha256: {{ pve_qcow2_stat.stat.checksum }}"
          - "vmid {{ pve_template_vmid }} config rc: {{ pve_existing_config.rc }}"
