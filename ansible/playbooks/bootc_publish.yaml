---
# Playbook: Publish the bootc image to the Quay registry.
# Workflow Stage: Image Publish
#
# Pushes a locally built image (default quay.io/ncdv/rhel10-base:<tag>) to Quay
# with robot credentials supplied via `op run`. Run:
#
#   op run --env-file images/op-run.publish.example -- \
#     ansible-playbook ansible/playbooks/bootc_publish.yaml \
#     -e bootc_publish_tag=rhel10-bootc-20260617.1
#
# Override bootc_publish_source_image if the local tag differs from the target.

- name: Publish bootc image
  hosts: localhost
  gather_facts: false
  roles:
    - role: bootc_publish
